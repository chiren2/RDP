name: RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download & Extract Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive -Force ngrok.zip -DestinationPath .

    - name: Connect to Ngrok
      run: .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Start Ngrok Tunnel
      run: Start-Process .\ngrok.exe -ArgumentList "tcp 3389"

    - name: Get RDP Access Info
      run: |
        Start-Sleep -Seconds 5
        $url = (Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop).tunnels.public_url
        Write-Host "=================================="
        Write-Host "RDP Address: $url"
        Write-Host "Username: runneradmin"
        Write-Host "=================================="

    - name: Keep Alive
      run: |
        $wshell = New-Object -ComObject Wscript.Shell
        while (1) {
          $wshell.SendKeys("{F15}")
          Start-Sleep -Seconds 60
        }
