name: Windows CRD

on:
  workflow_dispatch:
    inputs:
      AUTH_CODE:
        description: 'Google Headless sayfasından aldığınız Windows PowerShell kodu'
        required: true
      PIN:
        description: '6 haneli bağlantı PIN kodu (örn: 123456)'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Chrome Remote Desktop Indir ve Kur
      run: |
        Invoke-WebRequest -Uri "https://dl.google.com/remotedesktop/chromeremotedesktophost.msi" -OutFile "crd.msi"
        Start-Process msiexec.exe -Wait -ArgumentList "/i crd.msi /quiet"

    - name: Google Yetkilendirmesini Yap
      run: |
        $cmd = "${{ github.event.inputs.AUTH_CODE }}"
        $pin = "${{ github.event.inputs.PIN }}"
        $finalCmd = $cmd.TrimEnd('"') + " --pin=$pin`""
        Invoke-Expression $finalCmd

    - name: Baglantiyi Acik Tut
      run: |
        Write-Host "Uzak masaustu aktif! remotedesktop.google.com/access adresinden baglanabilirsiniz."
        while ($true) { Start-Sleep -Seconds 3600 }
